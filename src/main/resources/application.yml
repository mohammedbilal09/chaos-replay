spring:
  application:
    name: chaosreplay
  profiles:
    default: local
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

server:
  port: 8080
  shutdown: graceful

