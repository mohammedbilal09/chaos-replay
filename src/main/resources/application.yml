spring:
  application:
    name: chaosreplay
  profiles:
    default: local
  jpa:
    open-in-view: false
  servlet:
    multipart:
      enabled: false
  kafka:
    bootstrap-servers: ${chaosreplay.kafka.bootstrap-servers}
    consumer:
      group-id: ${chaosreplay.kafka.consumer-group}
      auto-offset-reset: ${chaosreplay.kafka.auto-offset-reset}

chaosreplay:
  kafka:
    enabled: ${CHAOSREPLAY_KAFKA_ENABLED:true}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    telemetry-topic: ${CHAOSREPLAY_KAFKA_TOPIC:chaosreplay.telemetry}
    dlq-topic: ${CHAOSREPLAY_KAFKA_DLQ_TOPIC:chaosreplay.telemetry.dlq}
    consumer-group: ${CHAOSREPLAY_KAFKA_CONSUMER_GROUP:chaosreplay-telemetry-group}
    consumer-concurrency: ${CHAOSREPLAY_KAFKA_CONCURRENCY:1}
    auto-offset-reset: earliest
    retry:
      max-attempts: ${CHAOSREPLAY_KAFKA_RETRY_MAX_ATTEMPTS:3}
      backoff-ms: ${CHAOSREPLAY_KAFKA_RETRY_BACKOFF_MS:1000}
  security:
    cors:
      enabled: ${CHAOSREPLAY_CORS_ENABLED:false}
      allowed-origins: ${CHAOSREPLAY_CORS_ALLOWED_ORIGINS:}
      max-age: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-components: always
      show-details: never
      probes:
        enabled: true
    env:
      enabled: false
    beans:
      enabled: false
    mappings:
      enabled: false
    configprops:
      enabled: false
    heapdump:
      enabled: false
    threaddump:
      enabled: false
  health:
    kafka:
      enabled: ${chaosreplay.kafka.enabled:true}
  info:
    env:
      enabled: false

server:
  port: 8080
  shutdown: graceful
  max-http-request-header-size: 8KB
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 2MB
